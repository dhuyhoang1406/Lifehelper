name: AI Review

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: Gemini
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Gemini API key is configured
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::GEMINI_API_KEY is missing. Add it as a secret in the 'Gemini' environment (free key from https://aistudio.google.com/apikey)."
            exit 1
          fi
          echo "GEMINI_API_KEY is configured."

      - name: Build numbered diff and valid comment positions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from scripts.gemini_review_response import bounded_diff

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]

          raw = subprocess.run(
              ["git", "diff", f"{base}...{head}"],
              capture_output=True, text=True, check=True,
          ).stdout
          with open("/tmp/review.diff", "w", encoding="utf-8") as f:
              f.write(raw)

          numbered = []
          valid = {}
          current_path = None
          new_line = None
          for line in raw.splitlines():
              if line.startswith("diff --git "):
                  m = re.search(r" b/(.+)$", line)
                  current_path = m.group(1) if m else None
                  valid.setdefault(current_path, set())
                  continue
              m = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@", line)
              if m:
                  new_line = int(m.group(1))
                  continue
              if current_path is None or new_line is None:
                  continue
              if line.startswith("+") or line.startswith(" "):
                  numbered.append(f"{current_path}:{new_line}:\t{line[1:]}")
                  valid[current_path].add(new_line)
                  new_line += 1
              # deleted lines (-) and "\ No newline" markers are skipped

          numbered_text, supplied_valid, coverage = bounded_diff(numbered)
          with open("/tmp/numbered.diff", "w", encoding="utf-8") as f:
              f.write(numbered_text)
          with open("/tmp/valid-lines.json", "w", encoding="utf-8") as f:
              json.dump(supplied_valid, f)
          with open("/tmp/review-coverage.json", "w", encoding="utf-8") as f:
              json.dump(coverage, f)
          print(f"Diff {len(raw)} bytes, {len(numbered)} numbered lines, "
                f"{sum(len(v) for v in valid.values())} valid comment positions")
          PY

      - name: Review changes with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GEMINI_MODELS: gemini-3.8-flash,gemini-3.7-flash,gemini-3.5-flash-lite
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.error, urllib.request
          from scripts.gemini_review_response import generation_config, parse_review_response

          with open("AGENTS.md", encoding="utf-8", errors="replace") as f:
              agents = f.read()
          with open("/tmp/numbered.diff", encoding="utf-8", errors="replace") as f:
              numbered = f.read()
          with open("/tmp/valid-lines.json", encoding="utf-8") as f:
              valid = json.load(f)
          with open("/tmp/review-coverage.json", encoding="utf-8") as f:
              coverage = json.load(f)
          if not valid:
              with open("/tmp/review.json", "w", encoding="utf-8") as f:
                  json.dump({"unavailable": True}, f)
              print("::warning::No complete diff lines available for review")
              raise SystemExit(0)

          tree = subprocess.run(
              ["git", "ls-tree", "-r", "--name-only", "HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          tree_text = "\n".join(tree[:120])
          if len(tree) > 120:
              tree_text += f"\n... ({len(tree) - 120} more paths)"

          schema = '''{
            "summary": "2-3 sentence overall assessment",
            "findings": [
              {
                "severity": "critical or high or medium or low",
                "file": "path exactly as in the numbered diff",
                "line": <new-file line number, or null if unsure>,
                "title": "short title",
                "detail": "why it matters",
                "suggestion": "concrete fix"
              }
            ]
          }'''

          prompt = (
              "You are reviewing pull request #" + os.environ["PR_NUMBER"]
              + " for the Lifehelper repository.\n\n"
              + "Repository review guidelines (AGENTS.md):\n" + agents + "\n\n"
              + "Repository layout:\n" + tree_text + "\n\n"
              + "Changed files with NEW-file line numbers (format: path:line:\\tcontent). "
              + "Use these exact paths and line numbers when reporting findings:\n"
              + numbered + "\n\n"
              + "Review the changes between " + os.environ["BASE_SHA"] + " and "
              + os.environ["HEAD_SHA"] + ". Look for correctness bugs, runtime and "
              + "security risks, architecture or service-boundary violations, hardcoded "
              + "configuration, duplication, weak error handling, unnecessary coupling, "
              + "maintainability or scalability problems, and missing important tests.\n\n"
              + "Return ONLY valid JSON with this exact schema (no markdown fences, no commentary):\n"
              + schema + "\n\n"
              + "Rules:\n"
              + "- severity: critical = security/data-loss/merge blocker; high = clear bug or risk; "
              + "medium = should improve; low = nit/style.\n"
              + "- file/line MUST come from the numbered diff above; use null when you cannot pin a line.\n"
              + "- Order findings by severity (critical first).\n"
              + "- Do not invent findings; if none, return findings: [] with a short summary.\n"
              + "- Return final conclusions only, not reasoning notes or speculative questions.\n"
              + "- Each finding needs a concrete trigger and consequence supported by the supplied code.\n"
              + "- The diff may be incomplete; state material review coverage limits in summary.\n"
          )

          body = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": generation_config(),
          }
          models = tuple(model.strip() for model in os.environ["GEMINI_MODELS"].split(",")
                         if model.strip())
          attempts_per_model = 2
          parsed = None
          selected_model = None
          last_error = None
          for model_index, model in enumerate(models):
              url = ("https://generativelanguage.googleapis.com/v1beta/models/"
                     + model + ":generateContent?key=" + os.environ["GEMINI_API_KEY"])
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              for attempt in range(1, attempts_per_model + 1):
                  try:
                      print(f"Reviewing with {model} (attempt {attempt}/{attempts_per_model})")
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          data = json.load(resp)
                      parsed = parse_review_response(data, valid)
                      selected_model = model
                      break
                  except (ValueError, TypeError):
                      last_error = f"Invalid or incomplete review output from {model}"
                      print(f"::warning::{last_error}; retrying/falling back within the attempt limit")
                      continue
                  except urllib.error.HTTPError as e:
                      last_error = f"Gemini API error {e.code} from {model}"
                      retryable = e.code in (408, 429, 500, 502, 503, 504)
                      if retryable and attempt < attempts_per_model:
                          retry_after = e.headers.get("Retry-After")
                          wait = min(60, int(retry_after)) if retry_after and retry_after.isdigit() else 20 * attempt
                          print(f"{model} busy ({e.code}); retry in {wait}s")
                          time.sleep(wait)
                          continue
                      if e.code in (400, 404) or retryable:
                          if model_index < len(models) - 1:
                              print(f"::warning::{last_error}; trying fallback model")
                          break
                      # Authentication/permission failures will not improve with another model.
                      break
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      last_error = f"Network error while calling {model}"
                      if attempt < attempts_per_model:
                          wait = 15 * attempt
                          print(f"{last_error}; retry in {wait}s")
                          time.sleep(wait)
                      else:
                          print("::warning::" + last_error)
                          break
              if parsed is not None:
                  break
              if last_error and ("error 401 " in last_error or "error 403 " in last_error):
                  break

          if parsed is None:
              with open("/tmp/review.json", "w", encoding="utf-8") as f:
                  json.dump({"unavailable": True, "summary": "Review chưa hoàn tất: không nhận được phản hồi hợp lệ sau retry/fallback có giới hạn."}, f)
              print("::warning::Gemini review incomplete. " + (last_error or "Unknown error"))
              raise SystemExit(0)
          print(f"Gemini review completed with {selected_model}")

          sev_rank = {"critical": 0, "high": 1, "medium": 2, "low": 3}
          badge = {"critical": "Critical", "high": "High", "medium": "Medium", "low": "Low"}
          findings = []
          for f in parsed.get("findings", []):
              sev = f.get("severity", "low")
              if sev not in sev_rank:
                  sev = "low"
              findings.append({
                  "severity": sev,
                  "file": str(f.get("file", "")),
                  "line": f.get("line"),
                  "title": str(f.get("title", "")),
                  "detail": str(f.get("detail", "")),
                  "suggestion": str(f.get("suggestion", "")),
              })
          findings.sort(key=lambda x: (sev_rank[x["severity"]], x["file"], x.get("line") or 0))

          merged = {}
          for f in findings:
              merged.setdefault((f["file"], f.get("line")), []).append(f)

          comments = []
          for (path, line), items in merged.items():
              if not path or line is None or path not in valid or line not in valid[path]:
                  continue
              if len(comments) >= 30:
                  break
              parts = [
                  "**[{b}] {t}**\n\n{d}".format(b=badge[it["severity"]], t=it["title"], d=it["detail"])
                  + ("\n\n**Suggestion:** " + it["suggestion"] if it["suggestion"] else "")
                  for it in items
              ]
              comments.append({"file": path, "line": line, "body": "\n\n---\n\n".join(parts)})

          inline_keys = {(c["file"], c["line"]) for c in comments}
          remaining = [f for f in findings if (f["file"], f.get("line")) not in inline_keys]

          with open("/tmp/review.json", "w", encoding="utf-8") as f:
              json.dump({
                  "fallback": False,
                  "model": selected_model,
                  "coverage": coverage,
                  "severityCounts": {sev: sum(f["severity"] == sev for f in findings) for sev in sev_rank},
                  "summary": parsed.get("summary", ""),
                  "findings": remaining,
                  "comments": comments,
                  "inlineCount": len(comments),
                  "totalFindings": len(findings),
              }, f, ensure_ascii=False)
          print(f"Gemini returned {len(findings)} findings; "
                f"{len(comments)} inlined, {len(remaining)} in summary")
          PY

      - name: Publish review result
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync('/tmp/review.json', 'utf8'));
            } catch (e) {
              data = null;
            }

            const badge = { critical: '🔴 Critical', high: '🟠 High', medium: '🟡 Medium', low: '🔵 Low' };
            let body;
            let comments = [];

            if (data && !data.fallback && !data.unavailable) {
              const counts = data.severityCounts || {};
              const total = data.totalFindings || 0;
              const partial = data.coverage?.truncated === true;
              const severityLine = ['critical', 'high', 'medium', 'low']
                .filter(s => counts[s])
                .map(s => `${badge[s]}: ${counts[s]}`)
                .join(' · ');

              const head = [
                '## AI Review (Gemini)',
                '',
                total === 0
                  ? (partial ? '**Không có finding trong phần diff đã review.**' : '**Không có vấn đề nào được phát hiện.** ✅')
                  : `**${total} finding(s)**${severityLine ? `\n\n${severityLine}` : ''}`,
                '',
                partial ? `⚠️ Review một phần: ${data.coverage.reviewedLines}/${data.coverage.totalLines} dòng diff được cung cấp; chưa bao phủ toàn bộ PR.` : '',
                data.summary || '',
                data.model ? `Model: \`${data.model}\`` : '',
                '',
              ];

              const inlineNote = data.inlineCount > 0
                ? `**${data.inlineCount} finding(s) đã được comment trực tiếp trên diff.**`
                : '';

              const list = (data.findings || []).map((f, i) =>
                `${i + 1}. [${badge[f.severity]}] **${f.title}** — \`${f.file}${f.line ? ':' + f.line : ''}\`` +
                (f.detail ? `\n   ${f.detail}` : '') +
                (f.suggestion ? `\n   💡 *Suggestion:* ${f.suggestion}` : '')
              );

              const bodyParts = [...head, inlineNote];
              if (list.length) bodyParts.push('', '### Findings chưa gắn inline', ...list);
              body = bodyParts.filter(Boolean).join('\n');

              comments = (data.comments || []).map(c => ({
                path: c.file,
                line: c.line,
                side: 'RIGHT',
                body: c.body,
              }));
            } else {
              body = [
                '## AI Review (Gemini)',
                '',
                '**Review chưa hoàn tất.** ⚠️',
                '',
                'Không nhận được kết quả JSON hợp lệ sau retry/fallback có giới hạn. Đây không phải kết luận không có finding.',
                'Xem Actions logs để biết trạng thái lỗi; có thể chạy lại review. Gemini chỉ là công cụ hỗ trợ phát triển.',
              ].join('\n');
            }

            // GitHub allows only one pending review per user per PR. Previous
            // runs may have left a pending review behind (createReview without
            // an event stays pending), which would 422 new reviews. Delete our
            // stale pending reviews first, then submit with event COMMENT so
            // the review is never left pending.
            const { owner, repo } = context.repo;
            const pr = context.issue.number;
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({ owner, repo, pull_number: pr });
              for (const r of reviews) {
                if (r.user && r.user.login === 'github-actions[bot]') {
                  try {
                    await github.rest.pulls.deletePendingReview({ owner, repo, pull_number: pr, review_id: r.id });
                    console.log(`Deleted stale pending review ${r.id}`);
                  } catch (e2) {
                    console.log(`Could not delete review ${r.id} (${e2.message}); ignoring.`);
                  }
                }
              }
            } catch (e) {
              console.log(`Review cleanup failed: ${e.message}`);
            }

            try {
              const r = await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: pr,
                body,
                comments,
                event: 'COMMENT',
              });
              console.log(`Review created: ${r.data.id}`);
            } catch (e) {
              console.log(`Inline review failed (${e.message}); posting summary only.`);
              try {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: pr,
                  body,
                  event: 'COMMENT',
                });
              } catch (e2) {
                console.log(`Summary review also failed: ${e2.message}`);
                throw new Error(`Could not publish AI review: ${e2.message}`);
              }
            }
