name: AI Review

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: Gemini
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Gemini API key is configured
        env:
          HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::GEMINI_API_KEY is missing. Add it under Settings > Secrets and variables > Actions (free key from https://aistudio.google.com/apikey)."
            exit 1
          fi
          echo "GEMINI_API_KEY is configured."

      - name: Fetch base commit and build diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "$BASE_SHA...$HEAD_SHA" > /tmp/review.diff
          size=$(wc -c < /tmp/review.diff)
          echo "Diff size: $size bytes"
          if [ "$size" -gt 60000 ]; then
            head -c 60000 /tmp/review.diff > /tmp/review.truncated.diff
            printf '\n... (diff truncated at 60000 bytes)\n' >> /tmp/review.truncated.diff
            mv /tmp/review.truncated.diff /tmp/review.diff
            echo "Diff truncated."
          fi

      - name: Review changes with Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          with open("AGENTS.md", encoding="utf-8", errors="replace") as f:
              agents = f.read()
          with open("/tmp/review.diff", encoding="utf-8", errors="replace") as f:
              diff = f.read()

          prompt = f"""You are reviewing pull request #{os.environ['PR_NUMBER']} for the Lifehelper repository.

          Repository review guidelines (AGENTS.md):
          {agents}

          Focus on the changes between {os.environ['BASE_SHA']} and {os.environ['HEAD_SHA']} (diff below). Read related code when context is necessary, but do not review the entire monorepo from scratch.

          Look for correctness bugs, runtime and security risks, architecture or service-boundary violations, hardcoded configuration, duplication, weak error handling, unnecessary coupling, maintainability or scalability problems, and missing important tests.

          Return concise, actionable findings. Include file and line references where possible, order findings by severity, and explain why each issue matters. Do not approve, merge, or modify the pull request. If there are no findings, return a short summary of what was reviewed.

          Diff:
          {diff}"""

          body = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"temperature": 0.2, "maxOutputTokens": 4096},
          }
          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-2.5-flash:generateContent?key="
              + os.environ["GEMINI_API_KEY"]
          )
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = json.load(resp)
          except urllib.error.HTTPError as e:
              print(f"::error::Gemini API error {e.code}: {e.read().decode('utf-8', 'replace')[:500]}")
              raise SystemExit(1)

          try:
              text = data["candidates"][0]["content"]["parts"][0]["text"]
          except (KeyError, IndexError):
              print(f"::error::Unexpected Gemini response: {json.dumps(data)[:500]}")
              raise SystemExit(1)

          with open("/tmp/review.md", "w", encoding="utf-8") as f:
              f.write(text)
          PY
          echo "Review generated ($(wc -c < /tmp/review.md) bytes)"

      - name: Publish review result
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');
            const body = [
              '## AI Review (Gemini)',
              '',
              review || 'Gemini completed without returning a review summary.',
              '',
              `_Reviewed commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`._`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
