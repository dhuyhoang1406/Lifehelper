name: Codex AI Review

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment: codex-review
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Review changes with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} for the Lifehelper repository.

            Read the root AGENTS.md before reviewing. Focus on the changes between
            ${{ github.event.pull_request.base.sha }} and ${{ github.event.pull_request.head.sha }}.
            Read related code when context is necessary, but do not review the entire
            monorepo from scratch.

            Look for correctness bugs, runtime and security risks, architecture or
            service-boundary violations, hardcoded configuration, duplication, weak
            error handling, unnecessary coupling, maintainability or scalability
            problems, and missing important tests.

            Return concise, actionable findings. Include file and line references
            where possible, order findings by severity, and explain why each issue
            matters. Do not approve, merge, or modify the pull request. If there are
            no findings, return a short summary of what was reviewed.

      - name: Publish review result
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ steps.codex.outputs.final-output }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              '## Codex AI Review',
              '',
              process.env.CODEX_REVIEW || 'Codex completed without returning a review summary.',
              '',
              `_Reviewed commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`._`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
