name: Technical Verification

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: technical-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lifehelper
          POSTGRES_PASSWORD: lifehelper
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifehelper -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lifehelper:lifehelper@localhost:5432/lifehelper_identity_ci?schema=public
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schemas
        run: pnpm prisma:validate

      - name: Generate Prisma clients
        run: pnpm prisma:generate

      - name: Create service databases
        env:
          PGPASSWORD: lifehelper
        run: |
          for database in identity productivity ai document notification analytics; do
            createdb --host localhost --username lifehelper "lifehelper_${database}_ci"
          done

      - name: Apply migrations
        run: |
          for service in identity productivity ai document notification analytics; do
            DATABASE_URL="postgresql://lifehelper:lifehelper@localhost:5432/lifehelper_${service}_ci?schema=public" \
              pnpm --filter "@lifehelper/${service}-service" db:migrate
          done

      - name: Lint
        run: pnpm lint

      - name: Build backend and shared packages
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:e2e

      - name: Run PostgreSQL persistence tests
        run: |
          for service in identity productivity ai document notification analytics; do
            DATABASE_URL="postgresql://lifehelper:lifehelper@localhost:5432/lifehelper_${service}_ci?schema=public" \
              pnpm --filter "@lifehelper/${service}-service" test:persistence
          done

  mobile:
    name: Flutter quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
